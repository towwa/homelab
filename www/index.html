<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400&display=swap">
<style>
  :root {
    --bg:          #07050f;
    --surface:     rgba(14,8,28,0.78);
    --border:      rgba(190,120,255,0.15);
    --glow-purple: #c084fc;
    --glow-pink:   #f472b6;
    --text:        #ece8f5;
    --text-soft:   #a393c8;
    --btn-surface: rgba(22,10,44,0.65);
    color-scheme: dark;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-weight:300}
  canvas#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .page{position:relative;z-index:1;min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:max(48px,env(safe-area-inset-top,0px)) max(48px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:24px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:48px 36px 40px;display:flex;flex-direction:column;align-items:center;box-shadow:0 0 0 1px rgba(192,132,252,0.06),0 32px 80px rgba(0,0,0,0.6),0 0 60px rgba(192,132,252,0.06)}
  .avatar-wrap{position:relative;margin-bottom:28px}
  .avatar-wrap::before{content:'';position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,var(--glow-purple),var(--glow-pink),var(--glow-purple));opacity:0.7;animation:spin 8s linear infinite}
  .avatar-wrap::after{content:'';position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,rgba(192,132,252,0.18) 0%,transparent 70%);animation:pulse 4s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:0.5;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
  .avatar{position:relative;z-index:1;width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:center top;display:block;border:2px solid rgba(14,8,28,0.9)}
  .name{font-family:'Cormorant Garamond',Georgia,serif;font-size:2.6rem;font-weight:300;letter-spacing:0.06em;color:var(--text);text-wrap:balance;margin-bottom:6px}
  .handle{font-size:0.78rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-soft);margin-bottom:36px}
  .links{width:100%;display:flex;flex-direction:column;gap:12px}
  .btn{display:flex;align-items:center;gap:14px;width:100%;padding:15px 22px;border-radius:14px;background:var(--btn-surface);border:1px solid transparent;color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:0.9rem;font-weight:300;letter-spacing:0.04em;text-decoration:none;cursor:pointer;transition:border-color .25s,box-shadow .25s,transform .18s;position:relative;overflow:hidden}
  .btn::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .25s;border-radius:inherit}
  .btn-discord{border-color:rgba(192,132,252,0.12)}
  .btn-discord::before{background:linear-gradient(135deg,rgba(192,132,252,0.08),transparent)}
  .btn-discord:hover{border-color:rgba(192,132,252,0.45);box-shadow:0 0 24px rgba(192,132,252,0.15),inset 0 0 0 1px rgba(192,132,252,0.1);transform:translateY(-1px)}
  .btn-discord:hover::before{opacity:1}
  .btn-steam{border-color:rgba(244,114,182,0.12)}
  .btn-steam::before{background:linear-gradient(135deg,rgba(244,114,182,0.08),transparent)}
  .btn-steam:hover{border-color:rgba(244,114,182,0.45);box-shadow:0 0 24px rgba(244,114,182,0.15),inset 0 0 0 1px rgba(244,114,182,0.1);transform:translateY(-1px)}
  .btn-steam:hover::before{opacity:1}
  .btn:focus-visible{outline:2px solid var(--glow-purple);outline-offset:2px}
  .btn-icon{flex-shrink:0;width:22px;height:22px;opacity:0.85}
  .btn-label{position:relative;z-index:1}
  .btn-sub{position:relative;z-index:1;margin-left:auto;font-size:0.76rem;color:var(--text-soft);letter-spacing:0.06em}
  .toast{position:fixed;bottom:max(28px,env(safe-area-inset-bottom,28px));left:50%;transform:translateX(-50%) translateY(12px);background:rgba(192,132,252,0.18);border:1px solid rgba(192,132,252,0.3);backdrop-filter:blur(12px);color:var(--glow-purple);font-size:0.78rem;letter-spacing:0.12em;padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(prefers-reduced-motion:reduce){.avatar-wrap::before,.avatar-wrap::after{animation:none}.btn{transition:none}}
</style>

<script>
(function(){
  var c=document.getElementById('bg'),ctx=c.getContext('2d'),W,H;
  var orbs=[{x:.2,y:.3,r:.28,h:270,s:.00007,p:0},{x:.8,y:.7,r:.22,h:310,s:.00005,p:1.2},{x:.5,y:.1,r:.18,h:290,s:.00009,p:2.4},{x:.1,y:.8,r:.16,h:330,s:.00006,p:3.6}];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  function draw(t){
    ctx.clearRect(0,0,W,H);
    orbs.forEach(function(o){
      var dx=Math.sin(t*o.s+o.p)*.06,dy=Math.cos(t*o.s*.7+o.p)*.05;
      var cx=(o.x+dx)*W,cy=(o.y+dy)*H,r=o.r*Math.min(W,H);
      var g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      g.addColorStop(0,'hsla('+o.h+',70%,65%,0.13)');
      g.addColorStop(.5,'hsla('+o.h+',60%,55%,0.06)');
      g.addColorStop(1,'hsla('+o.h+',50%,45%,0)');
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);resize();requestAnimationFrame(draw);
})();
